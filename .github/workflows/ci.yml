name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminology:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - run: |
          if git grep -nIwiE 'm[a]ster|s[l]ave'; then
            echo "Found legacy terminology."
            exit 1
          fi
      - run: python3 scripts/source_selection_m4_gate.py
      - run: python3 scripts/changelog_fragments.py check

  build:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module directory; restoring the
          # setup-go cache over it only adds tar conflicts and minutes.
          # Hosted runners start empty and keep the cache.
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: ./scripts/check_portal_assets.sh
      - run: go vet ./...
      - run: go build ./...
      - run: go build -tags nomatter -o /dev/null ./cmd/gateway
      - name: Compile Linux 32-bit gateway
        run: |
          GOOS=linux GOARCH=386 go build -o /dev/null ./cmd/gateway
          GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null ./cmd/gateway
          GOOS=linux GOARCH=arm GOARM=6 go build -o /dev/null ./cmd/gateway

  test-packages:
    # stays GitHub-hosted: race suite needs isolated CPU and the localhost-binding test is not runner-robust yet (CI migration val 3, see the follow-up issue linked in the PR body)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module directory; restoring the
          # setup-go cache over it only adds tar conflicts and minutes.
          # Hosted runners start empty and keep the cache.
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install pytest
      - run: python3 -m pip install -r requirements-lint.txt
      - run: python3 -m pytest tests/test_metrics_inventory_docs.py tests/test_naming_contract.py tests/test_dispatch_documentation.py tests/test_rename_underscore_packages.py -q -p no:cacheprovider
      # Packages other than cmd/gateway. cmd/gateway is the long pole (about
      # forty minutes under -race on the hosted runner) and runs in test-gateway.
      # This command keeps -timeout 75m. An empty package list fails the leg.
      - name: Race-test packages other than cmd/gateway
        run: |
          set -euo pipefail
          go list ./... > "$RUNNER_TEMP/packages.txt"
          grep -v '/cmd/gateway$' "$RUNNER_TEMP/packages.txt" > "$RUNNER_TEMP/packages-other.txt" || true
          if ! grep -q . "$RUNNER_TEMP/packages-other.txt"; then
            echo "no packages other than cmd/gateway" >&2
            exit 1
          fi
          mapfile -t packages < "$RUNNER_TEMP/packages-other.txt"
          go test -race -count=1 -timeout 75m "${packages[@]}"
      - run: GOMODCACHE="$(go env GOMODCACHE)" python3 scripts/check_no_matter_profile.py
      - name: SemReg PV public integration
        run: GOWORK=off go test -race -count=1 ./internal/modbusadapter ./m2mgraphql ./mcp ./portal ./cmd/gateway -run 'TestPVPublication|TestAdapterPublishesOneSemRegPVProjection|TestSemanticPV|TestPortalPV|TestM2MGraphQLRuntime'
      - run: python3 scripts/passive_canary_verifier_test.py
      - run: python3 scripts/source_selection_m4_gate_test.py
      - run: python3 scripts/transport_gate_test.py
      - run: python3 scripts/passive_smoke_gate_test.py
      - run: python3 scripts/check_python_lint.py
      - run: python3 -m unittest discover -s tests -p test_python_lint.py -v
      - run: python3 -m unittest discover -s tests -p test_changelog_fragments.py -v

  test-gateway:
    # stays GitHub-hosted: race suite needs isolated CPU and the localhost-binding test is not runner-robust yet (CI migration val 3, see the follow-up issue linked in the PR body)
    name: test-gateway (${{ matrix.config }}, ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # scripts/ci_test_parts.py --parts must equal the length of this list.
        part: [0, 1, 2, 3]
        config: [race, nomatter]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module directory; restoring the
          # setup-go cache over it only adds tar conflicts and minutes.
          # Hosted runners start empty and keep the cache.
          cache: ${{ runner.environment == 'github-hosted' }}
      # Each part runs the top-level tests go test -list prints for that build
      # configuration, and no others. Measured on 2026-11-27, cmd/gateway takes
      # about forty minutes under -race on the hosted runner. -timeout stays 75m
      # for the race run and 40m for the nomatter short run. A failed list, or
      # an empty part, fails the leg. Benchmarks, when the list has any, run
      # one iteration (-benchtime 1x) in the part that owns them.
      - name: Test this part of cmd/gateway
        run: |
          set -euo pipefail
          case "${{ matrix.config }}" in
            race)
              flags=(-race -count=1 -timeout 75m)
              ;;
            nomatter)
              flags=(-race -short -count=1 -timeout 40m -tags nomatter)
              ;;
            *)
              echo "unknown build configuration" >&2
              exit 1
              ;;
          esac
          go test -list '.*' "${flags[@]}" ./cmd/gateway > "$RUNNER_TEMP/cmd-gateway-tests.txt"
          python3 scripts/ci_test_parts.py --parts 4 --part "${{ matrix.part }}" < "$RUNNER_TEMP/cmd-gateway-tests.txt" > "$RUNNER_TEMP/part-spec.txt"
          run_expr=""
          bench_expr=""
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              "run "*) run_expr=${line#"run "} ;;
              "bench "*) bench_expr=${line#"bench "} ;;
              "") ;;
              *)
                echo "unexpected part spec" >&2
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/part-spec.txt"
          if [ -z "$run_expr" ]; then
            echo "part spec has no run expression" >&2
            exit 1
          fi
          if [ -n "$bench_expr" ]; then
            go test "${flags[@]}" -run "$run_expr" -bench "$bench_expr" -benchtime 1x ./cmd/gateway
          else
            go test "${flags[@]}" -run "$run_expr" ./cmd/gateway
          fi

  test:
    # Required check name. Repository settings name this job; they are unchanged.
    # needs on the matrix job waits for every part. always() plus the result
    # check fails this job when a leg fails, instead of skipping the check.
    needs: [test-packages, test-gateway]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every test leg succeeded
        run: |
          set -euo pipefail
          packages="${{ needs.test-packages.result }}"
          gateway="${{ needs.test-gateway.result }}"
          echo "test-packages: ${packages}"
          echo "test-gateway: ${gateway}"
          test "$packages" = success
          test "$gateway" = success

  lint:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
          # Compare the complete PR change set, including renames and deletions.
          # Hosted runners keep their existing shallow checkout.
          fetch-depth: ${{ runner.environment != 'github-hosted' && '0' || '1' }}
      - name: Require a changelog fragment
        # Needs the pull request history, which only the persistent runner checks out.
        if: ${{ github.event_name == 'pull_request' && runner.environment != 'github-hosted' }}
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/changelog_fragments.py check --require-new --base "$PR_BASE" --head "$PR_HEAD"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module directory; restoring the
          # setup-go cache over it only adds tar conflicts and minutes.
          # Hosted runners start empty and keep the cache.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Test lint flake guard
        if: runner.environment != 'github-hosted'
        run: |
          rm -f "$RUNNER_TEMP/lint-findings.txt"
          bash scripts/lint_flake_guard_test.sh
      - name: Prepare isolated self-hosted lint cache
        if: runner.environment != 'github-hosted'
        run: |
          # skip-cache disables action caching, not the linter's local cache.
          lint_cache=$(mktemp -d "$RUNNER_TEMP/golangci-lint.XXXXXX")
          echo "GOLANGCI_LINT_CACHE=$lint_cache" >> "$GITHUB_ENV"
      - uses: golangci/golangci-lint-action@v8
        id: lint
        with:
          # Keep in sync with GOLANGCI_LINT_EXPECTED_VERSION in scripts/ci_local.sh.
          version: v2.11.4
          # Shared restored caches can lose staticcheck's noreturn facts on
          # persistent runners. Hosted runners retain the action cache.
          skip-cache: ${{ runner.environment != 'github-hosted' }}
          # Allow cold runs ten minutes. Save self-hosted diagnostics without
          # source snippets or issue caps so the guard sees every finding.
          args: >-
            --timeout=10m
            ${{ runner.environment != 'github-hosted' && format('--output.text.path="{0}/lint-findings.txt" --output.text.colors=false --output.text.print-issued-lines=false --max-same-issues=0 --max-issues-per-linter=0', runner.temp) || '' }}
      - name: Identify self-hosted staticcheck runner flake
        if: ${{ failure() && steps.lint.outcome == 'failure' && runner.environment != 'github-hosted' }}
        env:
          LINT_LOG: ${{ runner.temp }}/lint-findings.txt
          CHANGED_FILES: ${{ runner.temp }}/lint-changed-files
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Keep every diagnostic visible even when flake classification rejects it.
          cat "$LINT_LOG"
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --no-renames --name-only -z "$PR_BASE...$PR_HEAD" > "$CHANGED_FILES"
            bash scripts/lint_flake_guard.sh "$LINT_LOG" pr "$CHANGED_FILES"
          else
            bash scripts/lint_flake_guard.sh "$LINT_LOG" push
          fi
          # The lint step remains failed: this warning requests triage/rerun,
          # never suppression, success, or an automatic retry loop.
